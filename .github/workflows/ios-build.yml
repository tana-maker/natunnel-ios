name: Build NA Tunnel iOS (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Environment
        run: |
          echo "==> Xcode version:"
          xcodebuild -version
          echo "==> macOS version:"
          sw_vers

      - name: Build iOS Application
        run: |
          xcodebuild clean build \
            -project NATunnel.xcodeproj \
            -scheme NATunnel \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .ipa for Sideloading
        run: |
          echo "==> Build outputs:"
          ls -la build/DerivedData/Build/Products/Release-iphoneos/
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/NATunnel.app build/Payload/
          cd build
          zip -qr NATunnel-iOS-v1.3.2.ipa Payload
          echo "==> IPA package created successfully:"
          ls -lh NATunnel-iOS-v1.3.2.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NATunnel-iOS-v1.3.2
          path: build/NATunnel-iOS-v1.3.2.ipa
          retention-days: 30
