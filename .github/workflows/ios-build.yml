name: Build NA Tunnel iOS (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Environment
        run: |
          echo "==> Xcode version:"
          xcodebuild -version
          echo "==> macOS version:"
          sw_vers

      - name: Build iOS Application
        run: |
          xcodebuild clean build \
            -project NATunnel.xcodeproj \
            -scheme NATunnel \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .ipa for Sideloading
        run: |
          echo "==> Build outputs:"
          ls -la build/DerivedData/Build/Products/Release-iphoneos/
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/NATunnel.app build/Payload/
          cd build
          zip -qr "NATunnel-v1.3.63(38)-release.ipa" Payload
          cp "NATunnel-v1.3.63(38)-release.ipa" "NATunnel.ipa"
          echo "==> IPA package created successfully:"
          ls -lh *.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NATunnel-v1.3.63-release
          path: build/*.ipa
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.63
          name: "NA Tunnel iOS v1.3.63 (Build 38)"
          body: |
            ## 📱 NA Tunnel iOS v1.3.63 (Build 38)
            - 🚀 High-Speed Sing-box Core v1.10.7
            - ⚡ Protocols: VLESS, VMess, Trojan, Shadowsocks
            - 📲 Ready for sideloading via TrollStore, AltStore, Sideloadly, Scarlet, or Esign
          files: build/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
